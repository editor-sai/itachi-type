<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>itachiType – Test</title>
  <link rel="stylesheet" href="css/cyber.css">
</head>
<body>

<div class="top">
  <div class="modes">
  <span class="home-btn" id="homeBtn">home</span>
  <span class="mode active" data-mode="time">time</span>
  <span class="mode" data-mode="words">words</span>
</div>


  <div class="options" id="options"></div>

  <div class="stats">
    <span>time <b id="time">30</b></span>
    <span>wpm <b id="wpm">0</b></span>
    <span>acc <b id="accuracy">100</b>%</span>
  </div>
</div>

<div class="center">
  <div id="typingText" class="typing-box"></div>
</div>
<div class="footer-hint">
  <span class="key">ctrl + H</span> → to home
</div>

<script src="js/test.js"></script>
</body>
</html>
